name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BlackoutWatch.slnx
      - run: dotnet test BlackoutWatch.slnx --configuration Release --no-restore
      - run: docker build --tag blackoutwatch:ci .
